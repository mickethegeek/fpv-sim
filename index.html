<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPV sim</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" aria-live="off">
  <span id="hud-state"></span>
  <span id="hud-mode"></span>
  <span><small>THR</small> <b id="hud-thr"></b></span>
  <span><small>SPEED</small> <b id="hud-speed"></b></span>
  <span><small>ALT</small> <b id="hud-alt"></b></span>
  <span><small>GATE</small> <b id="hud-gate"></b></span>
  <span><small>LAP</small> <b id="hud-lap"></b></span>
  <span><small>BEST</small> <b id="hud-best"></b></span>
</div>
<div id="guide" hidden><span id="guide-arrow">▲</span><span id="guide-text"></span></div>
<div id="toast" hidden></div>
<div id="hint" hidden></div>
<div id="panel">
  <div id="controller"></div>
  <div class="row">
    <button type="button" id="btn-setup">Set up controller</button>
    <button type="button" id="btn-reset">Reset (R)</button>
  </div>
  <table id="keys"></table>
</div>
<div id="setup" hidden></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
