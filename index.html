<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPV sim</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" aria-live="off">
  <span id="hud-state"></span>
  <span id="hud-mode"></span>
  <span id="hud-view"></span>
  <span><small>THR</small> <b id="hud-thr"></b></span>
  <span><small>SPEED</small> <b id="hud-speed"></b></span>
  <span><small>ALT</small> <b id="hud-alt"></b></span>
  <span class="race"><small>GATE</small> <b id="hud-gate"></b></span>
  <span class="race"><small>LAP</small> <b id="hud-lap"></b></span>
  <span class="race"><small>BEST</small> <b id="hud-best"></b></span>
</div>
<div id="sticks" hidden aria-hidden="true">
  <div class="stick"><i id="stick-l"></i></div>
  <div class="stick"><i id="stick-r"></i></div>
</div>
<div id="guide" hidden><span id="guide-arrow">▲</span><span id="guide-text"></span></div>
<div id="lesson" hidden><b id="lesson-title"></b><span id="lesson-line"></span><span id="lesson-step"></span></div>
<div id="card" hidden><b id="card-title"></b><span id="card-text"></span></div>
<div id="theory" hidden>
  <small id="theory-where"></small>
  <b id="theory-title"></b>
  <span id="theory-text"></span>
  <div id="theory-curve" hidden><svg viewBox="0 0 200 110" aria-label="Rotation speed against stick position"><path id="curve-line" fill="none" stroke="#ffd23f" stroke-width="2"/><circle id="curve-dot" r="5" fill="#fff"/>
    <text x="4" y="12" fill="#a9b4c4" font-size="10" id="curve-max"></text><text x="196" y="106" fill="#a9b4c4" font-size="10" text-anchor="end">stick →</text></svg></div>
  <div class="row"><button type="button" id="theory-prev">Back</button><button type="button" id="theory-next">Next</button></div>
  <small id="theory-keys"></small>
</div>
<div id="toast" hidden></div>
<div id="hint" hidden></div>
<div id="corner" hidden></div>
<div id="menu" hidden>
  <div class="menu-card">
    <h1 class="menu-title"></h1>
    <section data-screen="main" data-title="FPV sim">
      <button type="button" class="big" data-go="learn" data-first><b>Learn</b><small id="main-learn">Eight lessons, from first take-off to real-drone ready</small></button>
      <button type="button" class="big" data-act="gates"><b>Gates</b><small id="main-gates">Seven gates against the clock</small></button>
      <button type="button" class="big" data-act="free"><b>Free fly</b><small>The open field, nothing on screen you did not ask for</small></button>
      <button type="button" class="big" data-go="theory"><b>Theory</b><small>Every card, to revise any time</small></button>
      <button type="button" class="big" data-go="settings"><b>Settings</b><small>Controller, graphics, feel</small></button>
    </section>
    <section data-screen="learn" data-title="Learn" hidden>
      <p class="menu-note">Start anywhere. Nothing is locked, every part can be skipped.</p>
      <div id="badge" hidden>★ Real-drone ready</div>
      <div id="lesson-list"></div>
      <button type="button" data-go="back">Back</button>
    </section>
    <section data-screen="chapter" data-title="Chapter" hidden>
      <div id="chapter-parts"></div>
      <button type="button" data-go="back">Back</button>
    </section>
    <section data-screen="check" data-title="Check" hidden>
      <p id="check-q"></p>
      <div id="check-answers"></div>
      <p id="check-result" class="menu-note"></p>
      <button type="button" data-act="check-next" id="check-next" hidden>Next question</button>
      <button type="button" data-go="back">Back</button>
    </section>
    <section data-screen="theory" data-title="Theory" hidden>
      <p class="menu-note">Pick a card to see it shown in the sim.</p>
      <div id="theory-list"></div>
      <button type="button" data-go="back">Back</button>
    </section>
    <section data-screen="pause" data-title="Paused" hidden>
      <button type="button" data-act="resume" data-first>Resume</button>
      <button type="button" data-act="restart" id="btn-reset">Restart</button>
      <button type="button" data-act="skip" id="btn-skip">Skip this part</button>
      <button type="button" data-go="settings">Settings</button>
      <button type="button" data-act="quit">Back to menu</button>
    </section>
    <section data-screen="settings" data-title="Settings" hidden>
      <div id="controller"></div>
      <div class="row">
        <button type="button" id="btn-setup" data-first>Set up controller</button>
        <button type="button" id="btn-forget" hidden>Reset this controller</button>
      </div>
      <label class="tune-row">Graphics <select id="quality"><option value="high">High</option><option value="low">Low (slow computer)</option></select> <span id="fps"></span></label>
      <div class="row">
        <button type="button" data-act="sticks" id="btn-sticks"></button>
        <button type="button" data-act="view" id="btn-view"></button>
        <button type="button" data-act="arrows" id="btn-arrows"></button>
      </div>
      <label class="tune-row" id="uptilt-row"><span>Camera tilt</span><input type="range" id="uptilt" min="0" max="50" step="1"><output id="uptilt-out"></output></label>
      <button type="button" data-act="uptilt-auto" id="btn-uptilt-auto" hidden>Camera tilt back to default</button>
      <details id="tuning">
        <summary>Feel tuning</summary>
        <label class="tune-row">Quad <select id="tune-preset"></select></label>
        <div id="tune-info"></div>
        <div id="tune-sliders"></div>
        <button type="button" id="tune-reset">Reset to default</button>
      </details>
      <table id="keys"></table>
      <button type="button" data-go="back">Back</button>
    </section>
    <div id="menu-help"></div>
  </div>
</div>
<div id="setup" hidden></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
