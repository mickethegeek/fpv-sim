<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPV sim</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" aria-live="off">
  <span id="hud-state"></span>
  <span id="hud-mode"></span>
  <span id="hud-view"></span>
  <span><small>THR</small> <b id="hud-thr"></b></span>
  <span><small>SPEED</small> <b id="hud-speed"></b></span>
  <span><small>ALT</small> <b id="hud-alt"></b></span>
  <span><small>GATE</small> <b id="hud-gate"></b></span>
  <span><small>LAP</small> <b id="hud-lap"></b></span>
  <span><small>BEST</small> <b id="hud-best"></b></span>
</div>
<div id="sticks" hidden aria-hidden="true">
  <div class="stick"><i id="stick-l"></i></div>
  <div class="stick"><i id="stick-r"></i></div>
</div>
<div id="guide" hidden><span id="guide-arrow">▲</span><span id="guide-text"></span></div>
<div id="lesson" hidden><b id="lesson-title"></b><span id="lesson-line"></span><span id="lesson-step"></span></div>
<div id="card" hidden><b id="card-title"></b><span id="card-text"></span></div>
<div id="toast" hidden></div>
<div id="hint" hidden></div>
<div id="panel">
  <div id="controller"></div>
  <div class="row">
    <button type="button" id="btn-setup">Set up controller</button>
    <button type="button" id="btn-reset">Reset (R)</button>
    <button type="button" id="btn-forget" hidden>Reset this controller</button>
  </div>
  <table id="keys"></table>
  <details id="lessons" open>
    <summary>Lessons</summary>
    <div id="badge" hidden>★ Real-drone ready</div>
    <div id="lesson-list"></div>
  </details>
  <details id="tuning">
    <summary>Feel tuning</summary>
    <label class="tune-row">Quad <select id="tune-preset"></select></label>
    <div id="tune-info"></div>
    <div id="tune-sliders"></div>
    <button type="button" id="tune-reset">Reset to default</button>
  </details>
</div>
<div id="setup" hidden></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
